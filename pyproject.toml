[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whistle"
version = "0.0.1"
description = "Open-source football video analysis pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Whistle contributors"}]
dependencies = []

[project.optional-dependencies]
video = ["opencv-python>=4.8", "numpy>=1.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
whistle = "whistle.cli:main"

[tool.setuptools.packages.find]
include = ["whistle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
